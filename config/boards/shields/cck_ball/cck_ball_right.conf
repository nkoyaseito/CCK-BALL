# 基本機能の有効化
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

# 外部電源の管理
CONFIG_ZMK_EXT_POWER=y

# 最新のZMK標準PMW3610ドライバーを有効化
CONFIG_SPI_PMW3610=y

